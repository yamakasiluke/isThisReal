[build-system]
requires = [
  "setuptools>=69.0.0",
  "wheel",
]
build-backend = "setuptools.build_meta"

[project]
name = "is-this-real"
version = "0.1.0"
description = "Tweet credibility analysis backend and bot core"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.111.0",
  "httpx>=0.27.0",
  "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dev = [
  "ruff>=0.5.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*"]

[tool.setuptools.package-data]
backend = ["core/prompts/*.md"]
